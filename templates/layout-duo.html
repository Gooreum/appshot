<style>
  /*
   * 디바이스 2대 겹침 — 두 화면의 흐름을 한 장에 담는다.
   * 뒤쪽 기기는 작게·흐리게·기울여서 확실히 뒤로 물러나게 한다.
   * 두 기기가 같은 크기면 시선이 어디로 가야 할지 알 수 없다.
   */
  .stage--duo {
    padding-top: var(--safe-top);
  }

  .stage--duo .device-area {
    align-items: flex-start;
    padding-top: calc(var(--u) * 5);
    overflow: visible;
  }

  /*
   * 두 기기는 나란히가 아니라 겹쳐야 한다.
   * flex로 나열하면 프레임 두 개 폭이 캔버스를 넘어 잘린다 —
   * 각각을 절대 배치하고 중앙 기준으로 어긋나게 민다.
   * 이동량을 %로 두면 프레임 폭이 규격마다 달라져도 겹침 비율이 유지된다.
   *
   * 회전은 bounding box를 키운다 — 폭 w, 높이 h를 t도 돌리면
   * 가로로 h*sin(t)만큼 넓어진다. 세로로 긴 프레임에서는 이 값이
   * 무시 못 할 크기라 어긋남을 그만큼 보수적으로 잡는다.
   */
  .duo {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .duo-back,
  .duo-front {
    position: absolute;
    top: 0;
    left: 50%;
    transform-origin: top center;
  }

  .duo-back {
    z-index: 1;
    transform: translateX(-50%) translate(26%, -1%) scale(0.86) rotate(-5deg);
    filter: brightness(0.80) saturate(0.88);
  }

  .duo-front {
    z-index: 2;
    transform: translateX(-50%) translate(-20%, 6%) rotate(2deg);
  }
</style>

<div class="bg"></div>
<div class="noise"></div>

<div class="stage stage--duo">
  <div class="copy">
    <h1 class="headline">{{headline}}</h1>
    {{#subhead}}<p class="subhead">{{subhead}}</p>{{/subhead}}
  </div>
  <div class="device-area">
    <div class="duo">
      <div class="duo-back">{{{device2}}}</div>
      <div class="duo-front">{{{device}}}</div>
    </div>
  </div>
</div>
