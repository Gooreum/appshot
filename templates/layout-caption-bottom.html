<style>
  /*
   * 상단 디바이스 + 하단 카피.
   * 디바이스를 캔버스 최상단 가까이 붙여 화면 상단 UI(상태바·헤더)가
   * 잘리지 않고 그대로 보이게 한다. 앱의 첫인상을 보여줄 때 쓴다.
   *
   * 프레임 높이는 layouts.js의 deviceHeight(0.80)에서 역산되므로
   * 여기서 음수 마진으로 억지로 밀어 올릴 필요가 없다.
   */
  .stage--caption-bottom {
    justify-content: flex-end;
    padding-top: calc(var(--u) * 3);
    padding-bottom: calc(var(--safe-bottom) * 1.6);
  }

  /* 카피가 아래에 있으므로 기기는 남은 높이 안에 들어가야 한다 (layout-angled.html 참고) */
  .stage--caption-bottom .device-area {
    align-items: flex-start;
    padding-bottom: calc(var(--u) * 6);
    overflow: visible;
    container-type: size;
  }

  .stage--caption-bottom .device {
    width: min(var(--device-w), calc(100cqh / var(--device-hpw)));
  }
</style>

<div class="bg"></div>
<div class="noise"></div>

<div class="stage stage--caption-bottom">
  <div class="device-area">
    {{{device}}}
  </div>
  <div class="copy">
    <h1 class="headline">{{headline}}</h1>
    {{#subhead}}<p class="subhead">{{subhead}}</p>{{/subhead}}
  </div>
</div>
